name: Companion gates and installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.policy.outputs.version }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Require a new version for runtime and packaging changes
        id: policy
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-policy.mjs

  package:
    # Actual source cloning, frozen dependency installation and build are a
    # separate matrix below; binary packaging never substitutes for those gates.
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            command: package:adhoc
            output: adhoc
          - os: windows-2022
            arch: x64
            command: package:win
            output: windows
          - os: ubuntu-22.04
            arch: x64
            command: package:linux
            output: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install Linux desktop smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libfuse2 libgtk-3-0 libnss3 libasound2 libgbm1
      - run: pnpm install --frozen-lockfile
      - name: Materialize the pinned Electron runtime before build and tests
        run: node node_modules/electron/install.js
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - name: Build platform installers
        env:
          # Ad-hoc Mac signing uses identity "-", never a certificate or secret.
          # PR artifacts must exercise the same signature validation as main.
          CSC_FOR_PULL_REQUEST: ${{ matrix.command == 'package:adhoc' && 'true' || 'false' }}
        run: pnpm ${{ matrix.command }}
      - name: Exercise current native updater with a pinned physical fixture
        if: runner.os != 'Linux'
        run: node scripts/smoke-update.mjs
      - name: Exercise current AppImage updater with Chromium sandbox
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-update.mjs
      - name: Launch installed Windows or macOS application with a disposable profile
        if: runner.os != 'Linux'
        run: node scripts/smoke-package.mjs
      - name: Launch AppImage with Chromium sandbox and a disposable profile
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-package.mjs
      - name: Package unsigned browser upload archives
        if: runner.os == 'macOS'
        run: |
          node browser-extension/build.mjs production --browser=chrome --zip
          node browser-extension/build.mjs production --browser=firefox --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-release-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.output }}/*.zip
            dist/${{ matrix.output }}/*.dmg
            dist/${{ matrix.output }}/*.exe
            dist/${{ matrix.output }}/*.AppImage
            dist/${{ matrix.output }}/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: companion-release-browser-source
          if-no-files-found: error
          path: browser-extension/dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: companion-release-source-installers
          if-no-files-found: error
          path: |
            scripts/install-source.sh
            scripts/install-source.ps1
            scripts/install-source.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-update-evidence-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/update-smoke.json

  source:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: x64
          - os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          architecture: ${{ matrix.arch }}
      - name: Install Linux graphical source smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - name: Bootstrap, build, launch and update managed source
        if: runner.os != 'Linux'
        run: node scripts/smoke-source-update.mjs
      - name: Bootstrap, build, launch and update managed source with Chromium sandbox
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-source-update.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-source-update-evidence-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/source-update-smoke.json

  release:
    needs: [version, package, source]
    if: >-
      github.repository == 'jobstash/recruiters-rip-companion' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: companion-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: companion-release-*
          path: release-artifacts
      - name: Publish complete immutable version after every native gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-artifacts
