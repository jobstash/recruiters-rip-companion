name: Companion gates and installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            command: package:adhoc
            output: adhoc
          - os: windows-2022
            arch: x64
            command: package:win
            output: windows
          - os: ubuntu-22.04
            arch: x64
            command: package:linux
            output: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
      - name: Package unsigned browser upload archives
        run: |
          node browser-extension/build.mjs production --browser=chrome --zip
          node browser-extension/build.mjs production --browser=firefox --zip
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.output }}/*.zip
            dist/${{ matrix.output }}/*.dmg
            dist/${{ matrix.output }}/*.exe
            dist/${{ matrix.output }}/*.AppImage
            dist/${{ matrix.output }}/SHA256SUMS.txt
            browser-extension/dist/*.zip
            src/generated/*.mcpb
