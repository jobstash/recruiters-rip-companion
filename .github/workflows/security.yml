name: Companion security boundaries

on:
  push:
    branches: [main, 'security/**']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-fixtures:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Exercise actual source recovery children and native readiness publication
        run: node --test test/source-update-helper.test.mjs test/update-install.test.mjs test/smoke-source-boundaries.test.mjs test/release-policy.test.mjs
      - name: Exercise native Windows pathname replacement while descriptors remain open
        run: node --test --test-name-pattern="reads the inspected|source receipts reject|source receipt reads reject" test/host-setup.test.mjs test/source-updates.test.mjs

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Node 24 Alpine 3.24 headless verification image
        run: docker build --pull --file Dockerfile.headless --tag companion-headless .
      - name: Exercise synthetic authentication and storage boundaries without external network
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges companion-headless
      - name: Audit the locked dependency graph
        run: docker run --rm companion-headless pnpm audit

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
