name: Windows ACL diagnostic
on:
  pull_request:
    paths:
      - scripts/windows-acl-diagnostic.cjs
      - .github/workflows/windows-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: node scripts/windows-acl-diagnostic.cjs
