<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recruiters.rip</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="panel.css"></head>
<body>
<header><img src="brand/recruiters-rip-lockup-reversed.svg" alt="Recruiters.rip" width="180" height="32"><button id="settings" class="quiet">Settings</button></header>
<main>
<nav aria-label="Page tools"><button id="detect">Read page</button></nav>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><button id="cancel" class="quiet" hidden>Cancel preparation</button>
<section id="page" hidden><h1 id="title"></h1></section>
<section id="application" hidden aria-labelledby="application-heading">
<h2 id="application-heading">For this job</h2>
<p id="application-title"></p><p id="application-status" role="status" aria-live="polite"></p>
<button id="application-open-ad" class="quiet" hidden>Read job ad</button>
<div id="application-preparation">
<label for="application-host">Prepare with</label><select id="application-host"><option value="claude">Claude</option><option value="codex">Codex</option></select>
<button id="application-prepare" class="quiet">Prepare this application</button>
<p id="application-handoff" role="status" hidden></p>
</div>
<div id="application-documents"></div>
<p id="application-writing" role="status" hidden></p>
<button id="application-answers" class="quiet" hidden>Use saved answers</button>
<p id="application-notice" role="status" hidden></p>
<p id="application-upload" class="meta" hidden>Upload documents on the application page yourself.</p>
</section>
<section id="form" hidden>
<p id="ready" role="status" hidden></p><p id="paste" role="status" aria-live="polite" hidden></p>
<button id="configure" class="quiet" hidden>Configure in Companion</button>
<form id="details-form" hidden><h2>Missing details</h2><p>Save on this computer for your next application.</p><div id="question-list"></div><button id="save-details" type="submit">Save details</button></form>
<details id="review" hidden><summary>Review answers</summary><div id="field-list"></div><div id="unresolved"></div><div id="review-actions" hidden><button id="copy" class="quiet">Copy selected values</button></div></details>
</section>
<details id="jobs" hidden><summary>Detected jobs</summary><div id="job-list"></div><button id="save" class="quiet">Save selected jobs</button></details>
</main><script type="module" src="panel.mjs"></script>
</body></html>
