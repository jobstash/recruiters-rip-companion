<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recruiters.rip</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="panel.css"></head>
<body>
<header><img src="brand/recruiters-rip-mark-reversed.svg" alt="" width="20" height="17"><span>recruiters.rip</span></header>
<hr class="spectrum">
<main>
<section id="page" hidden><h2 class="label">For this job</h2><p class="job"><span id="title"></span><span id="company" hidden></span></p></section>
<div id="primary-actions" class="actions">
<button id="detect" hidden>Read page</button><button id="application-prepare" hidden>Prepare application</button>
<button id="recover" hidden>Open Companion</button><button id="cancel" hidden>Stop</button>
<button id="application-answers" hidden>Use saved answers</button><button id="prepare-saved" hidden>Use saved answers</button>
<button id="install" class="quiet" hidden>Get Companion</button><button id="application-open-ad" class="text" hidden>Open job ad</button>
</div>
<section id="form" aria-labelledby="answers-label" hidden>
<h2 id="answers-label" class="label">Prepared answers</h2><ul id="answer-list" class="list"></ul>
<details id="review" hidden><summary>Edit answers</summary><div id="field-list"></div><div id="review-actions" hidden><button id="copy" class="text">Copy selected</button></div></details>
</section>
<section id="application" aria-labelledby="documents-label" hidden>
<h2 id="documents-label" class="label">Documents</h2>
<ul class="list">
<li class="item"><span id="cv-mark" class="dot" aria-hidden="true"></span><span class="name">CV</span><button id="show-cv" class="text" aria-label="Show CV" hidden>Show</button><span id="cv-state" class="state"></span></li>
<li class="item"><span id="letter-mark" class="dot" aria-hidden="true"></span><span class="name">Cover letter</span><button id="copy-intro" class="text" aria-label="Copy cover letter" hidden>Copy</button><span id="letter-state" class="state"></span></li>
</ul>
<p id="application-notice" class="note" role="status" hidden></p>
</section>
<section id="jobs" aria-labelledby="jobs-label" hidden>
<h2 id="jobs-label" class="label">Jobs on this page</h2><ul id="job-list" class="list"></ul>
<button id="save" class="quiet">Save as applied</button>
</section>
<details id="options"><summary>Options</summary>
<label for="application-host" class="label">AI app</label><select id="application-host"><option value="claude">Claude</option><option value="codex">Codex</option></select>
<button id="refresh" class="text">Read page again</button>
<details id="optional-settings" hidden><summary>Extra form help</summary><p>Optional help choosing saved answers uses a separately billed OpenAI API key in Companion.</p><button id="configure" class="text">Open settings</button></details>
</details>
</main>
<footer><p id="status" role="status" aria-live="polite"></p><p id="paste" aria-live="polite" hidden></p><p id="error" role="alert" hidden></p></footer>
<script type="module" src="panel.mjs"></script>
</body></html>
