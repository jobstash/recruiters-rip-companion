<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recruiters.rip</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="panel.css"></head>
<body>
<header><img src="brand/recruiters-rip-lockup-reversed.svg" alt="Recruiters.rip" width="180" height="32"><button id="settings" class="text-button">Open Companion</button></header>
<main>
<section id="page" hidden><h1 id="title"></h1><p id="company" class="meta" hidden></p></section>
<section id="flow" aria-label="Next step">
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
<div id="primary-actions">
<button id="detect" hidden>Read page</button><button id="application-prepare" hidden>Prepare application</button>
<button id="recover" hidden>Open Companion</button><button id="cancel" hidden>Stop</button>
<button id="application-answers" hidden>Use saved answers</button>
<button id="prepare-saved" hidden>Use saved answers</button>
</div>
<button id="install" class="quiet" hidden>Get Companion</button>
</section>
<section id="application" aria-label="Ready for this job" hidden>
<div id="application-documents" class="document-actions"><button id="show-cv" class="quiet" hidden>Show CV</button><button id="copy-intro" class="quiet" hidden>Copy intro</button></div>
<p id="application-notice" role="status" hidden></p>
</section>
<section id="form" aria-label="Application answers" hidden>
<p id="ready" role="status" hidden></p><p id="paste" aria-live="polite" hidden></p>
<details id="review" hidden><summary>Review answers</summary><div id="field-list"></div><div id="unresolved"></div><div id="review-actions" hidden><button id="copy" class="quiet">Copy selected</button></div></details>
<details id="missing-details" hidden><summary>Add missing details</summary><form id="details-form" hidden><p>Save these details for your next application.</p><div id="question-list"></div><button id="save-details" type="submit" class="quiet">Save details</button></form></details>
</section>
<section id="job-selection" aria-label="Choose a job" hidden><div id="candidate-list"></div></section>
<details id="jobs" hidden><summary>Save jobs from this page</summary><div id="job-list"></div><button id="save" class="quiet">Save selected</button></details>
<details id="options"><summary>Options</summary>
<label for="application-host">AI app</label><select id="application-host"><option value="claude">Claude</option><option value="codex">Codex</option></select>
<button id="refresh" class="quiet">Read page again</button>
<button id="application-open-ad" class="quiet" hidden>Open job ad</button>
<details id="optional-settings" hidden><summary>Extra form help</summary><p>Optional help choosing saved answers uses a separately billed OpenAI API key in Companion.</p><button id="configure" class="quiet">Open settings</button></details>
</details>
</main><script type="module" src="panel.mjs"></script>
</body></html>
